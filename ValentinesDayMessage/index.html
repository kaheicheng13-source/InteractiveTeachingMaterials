<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valentine</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Hidden looping audio (no controls) -->
  <audio id="bgm" src="liebestraumShort.mp3" loop preload="auto"></audio>

  <div class="stage">
    <button class="heart-btn" id="heartBtn" type="button" aria-label="Valentine heart">
      <div class="heart-shape" aria-hidden="true"></div>
      <div class="heart-text" id="heartText">
        Be my valentine, <span id="nameSlot">LOVE</span>!
      </div>
    </button>
  </div>

  <script src="sketch.js"></script>
</body>
</html>
